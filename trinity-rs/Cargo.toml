[workspace]
resolver="3"
members=["vendor/blue-rs/crates/blueexposure","vendor/blue-rs/crates/blue","crates/trinity-meta","crates/trinity-macros","crates/trinityal","crates/trinity","crates/trinity-py","crates/trinity-codegen"]
[workspace.package]
edition="2024"
license="MIT"
authors=["Carbon Engine contributors"]
repository="https://github.com/QuasarRay/trinity"
rust-version="1.97.1"
[workspace.dependencies]
bevy={version="=0.20.0",default-features=false,features=["default_app","3d_bevy_render","serialize"]}
pyo3={version="=0.30.1",features=["macros"]}
genco="=0.20.0"
delegate="=0.13.5"
derive_more={version="=2.1.1",features=["display","from","deref","deref_mut"]}
proc-macro2="=1.0.107"
quote="1"
syn={version="2",features=["full","extra-traits"]}
roxmltree="0.21"
walkdir="2"
regex="1"
serde={version="1",features=["derive"]}
serde_json="1"
toml="0.9"
thiserror="2"
blue={path="vendor/blue-rs/crates/blue"}
blueexposure={path="vendor/blue-rs/crates/blueexposure"}
trinity-meta={path="crates/trinity-meta"}
trinity-macros={path="crates/trinity-macros"}
trinityal={path="crates/trinityal"}
trinity-rs={package="carbon-trinity-rs",path="crates/trinity"}
[workspace.lints.rust]
unsafe_code="forbid"
unexpected_cfgs={level="warn",check-cfg=["cfg(kani)"]}
[workspace.lints.clippy]
all={level="warn",priority=-1}
pedantic={level="warn",priority=-1}
module_name_repetitions="allow"
missing_errors_doc="allow"
missing_panics_doc="allow"
