name: Trinity-rs

on:
  push:
    branches: [trinity-rs-dev]
    paths:
      - 'trinity-rs/**'
      - '.github/workflows/trinity-rs.yml'
  pull_request:
    paths:
      - 'trinity-rs/**'
      - '.github/workflows/trinity-rs.yml'
  workflow_dispatch:
    inputs:
      run_kani:
        description: 'Run generated Kani harnesses'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  rust:
    name: Rust + generated contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trinity-rs
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
        working-directory: .
      - name: Generate Doxygen XML and Rust inventories
        run: ./scripts/regenerate.sh
      - name: Upload generated contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: trinity-rs-generated-contracts
          if-no-files-found: error
          path: |
            trinity-rs/generated/inventory.json
            trinity-rs/generated/legacy_tests.rs
            trinity-rs/generated/doxygen_symbols.rs
            trinity-rs/generated/compatibility-matrix.md
            trinity-rs/generated/kani-pairing.md
            trinity-rs/generated/kani/**
            trinity-rs/crates/trinity/tests/trinity_kani_generated.rs
            trinity-rs/crates/trinityal/tests/trinity_kani_generated.rs
      - name: Normalize Rust formatting for validation
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Sync generated contract evidence
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/trinity-rs-dev' }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             trinity-rs/generated/inventory.json             trinity-rs/generated/legacy_tests.rs             trinity-rs/generated/doxygen_symbols.rs             trinity-rs/generated/compatibility-matrix.md             trinity-rs/generated/kani-pairing.md             trinity-rs/generated/kani             trinity-rs/crates/trinity/tests/trinity_kani_generated.rs             trinity-rs/crates/trinityal/tests/trinity_kani_generated.rs
          if git diff --cached --quiet; then
            echo "Generated contract evidence is already current."
          else
            git commit -m "chore(trinity-rs): sync generated contract evidence [skip ci]"
            git push origin HEAD:trinity-rs-dev
          fi

  kani:
    name: Generated Kani harnesses
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_kani }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trinity-rs
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
        working-directory: .
      - name: Generate contracts
        run: ./scripts/regenerate.sh
      - name: Install Kani
        run: cargo install --locked kani-verifier
      - name: Set up Kani
        run: cargo kani setup
      - name: Verify generated harnesses
        run: ./scripts/kani.sh
