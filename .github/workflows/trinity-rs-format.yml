name: Format Trinity-rs

on:
  push:
    branches: [trinity-rs-dev]
    paths:
      - '.github/workflows/trinity-rs-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: trinity-rs-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format workspace
        working-directory: trinity-rs
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- trinity-rs; then
            exit 0
          fi
          git config user.name 'trinity-rs-format[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trinity-rs
          git commit -m 'format Trinity-rs workspace'
          git push origin HEAD:trinity-rs-dev
