name: Bootstrap Trinity-rs

on:
  push:
    branches: [trinity-rs-dev]
    paths:
      - '.trinity-rs-bootstrap/**'
      - '.github/workflows/trinity-rs-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/trinity-rs-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: trinity-rs-dev
      - name: Verify transport segments
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/trinity-rs-segments.sha256 <<'EOF'
          24bba3594d23dd2f7ca77b77ef61078db29cdd1d8b1167c7f3ac76e6a1e28c3d  .trinity-rs-bootstrap/part-000
          31d440709ad63212f03c60d99e31c2641ffa9ac57e274372df466b21b39cae65  .trinity-rs-bootstrap/part-000-01
          66ca5e32857cdbb97017862460ddad6b5e126b57c258ab8fd0906fc6eb9ecf08  .trinity-rs-bootstrap/part-000-02
          7517ebc791dccba63bac29da7c1e191c9af69f781206b261c33a141f00a1a9f9  .trinity-rs-bootstrap/part-000-03
          4dab62c73bac302bd63b9aa288ef6d066961e4b3a297668f0a099d953c2bfd1e  .trinity-rs-bootstrap/part-000-04
          0267fefc90c65cdf78488daa9eb58ade4a33e0fcb85b57d4aa8341cd45d04395  .trinity-rs-bootstrap/part-000-05
          920a2ae8401bbb3aadb99e8366cf0dcab4ebfa7691d724748d1e36d549f0b979  .trinity-rs-bootstrap/part-000-06
          333afbc6c07eba41d1d7507bb29568e040d31b0e40523067e87873db7b29479c  .trinity-rs-bootstrap/part-001
          66e79df6590aca5d8d640f068353b889be421c184ddbf00efd8e8a62d7286fd9  .trinity-rs-bootstrap/part-002
          6ebc7e6ed1ab130d16507f47fd9e9cd754c81d36b1798ad1cd72e2e4db5f00de  .trinity-rs-bootstrap/part-003
          9a85ba4aefa258e1e3fcfd23257bd8ebe631a829dce3fba34709fc73cfcc8ee4  .trinity-rs-bootstrap/part-004
          537a48d50a3b67ae946b9e0294ac8a4ed1eaa71f972c7e3f37e04235fb7d689d  .trinity-rs-bootstrap/part-005
          4277f6fe563bbf20365f4901cf934ffcebc9dcb8ffd00bbd799cc4570e6e006b  .trinity-rs-bootstrap/part-006
          f1221047573f1bb1dc4bf696696e59256140bd1b53b891c98592f56cb4fea91e  .trinity-rs-bootstrap/part-007
          EOF
          sha256sum --check /tmp/trinity-rs-segments.sha256
      - name: Materialize authored Trinity-rs tree
        shell: bash
        run: |
          set -euo pipefail
          cat .trinity-rs-bootstrap/part-* > /tmp/trinity-rs.tar.gz.b64
          base64 --decode /tmp/trinity-rs.tar.gz.b64 > /tmp/trinity-rs.tar.gz
          echo '9e2fefc422fed2adbd82ce9ac1f0b02d00cf7bef2b2858759275ce8396af4bea  /tmp/trinity-rs.tar.gz' | sha256sum --check
          tar -xzf /tmp/trinity-rs.tar.gz
          rm -rf .trinity-rs-bootstrap
          git config user.name 'trinity-rs-bootstrap[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/trinity-rs.yml
          git add -A trinity-rs .trinity-rs-bootstrap
          git commit -m 'implement Trinity-rs on Bevy with generated Kani contracts'
          git push origin HEAD:trinity-rs-dev
